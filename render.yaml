services:
  - type: web
    name: my-ai-world
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_SECRET
        generateValue: true
      - key: SITE_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
